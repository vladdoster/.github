name: Lint Commit Messages

on:
  pull_request:
    branches: [main,master]
  workflow_call:
  workflow_dispatch:

jobs:
  commit:
    name: commitlint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
      # Lint the PR commits or the pushed commits. Other events have no commits to lint.
      - if: github.event.pull_request || github.event_name == 'push'
        uses: docker://ghcr.io/vladdoster/commitlint:latest
        with:
          args: >-
            --verbose ${{ github.event.pull_request && format('--from {0} --to {1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event_name == 'push' && !github.event.created && !github.event.forced) && format('--from {0} --to {1}', github.event.before, github.event.after) || '--last' }}
