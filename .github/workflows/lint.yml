name: Lint

on:
  pull_request:
    branches: [main,master]
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # The image entrypoint is `zsh -o extendedglob -c`. Each args value is one quoted command.
      - name: markdown
        uses: docker://ghcr.io/vladdoster/lint:latest
        with:
          args: >-
            "f=(./**/*.md~*/CHANGELOG.md(.ND)); (( ! $#f )) || mdformat --check --wrap 120 $f"
      - name: shell format
        uses: docker://ghcr.io/vladdoster/lint:latest
        with:
          args: >-
            "f=(./**/*.sh(.ND)); (( ! $#f )) || shfmt -bn -ci -d -i 2 -ln bash -s -sr $f"
      - name: shell logic
        uses: docker://ghcr.io/vladdoster/lint:latest
        with:
          args: >-
            "f=(./**/*.sh(.ND)); (( ! $#f )) || shellcheck $f"
      - name: zsh syntax
        uses: docker://ghcr.io/vladdoster/lint:latest
        with:
          args: >-
            "r=0; for f (./**/*.zsh(.ND)) { zsh -n $f || r=1 }; exit $r"
      - name: zsh compile
        uses: docker://ghcr.io/vladdoster/lint:latest
        with:
          args: >-
            "r=0; for f (./**/*.zsh(.ND)) { zcompile /tmp/zwc $f || r=1 }; exit $r"
